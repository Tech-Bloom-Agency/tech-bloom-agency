name: CI

# Garde-fou qualité : tout ce qui arrive sur preprod/prod doit passer
# lint + typecheck + build avant que Vercel ne déploie.
on:
  # Toute PR, quelle que soit sa base : une PR empilée sur une branche de
  # travail doit être vérifiée comme les autres.
  pull_request:
  push:
    branches: [prod, preprod]
  workflow_dispatch:

# Une seule exécution par branche/PR : les pushes successifs annulent les runs obsolètes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Jamais d'annulation sur prod : ce run porte le déploiement.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Cache du compilateur Next pour accélérer les builds successifs.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build

  audit:
    name: Audit dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informatif : l'endpoint npm audit est parfois indisponible et des avis
      # apparaissent sans correctif. Le step signale sans faire échouer le job.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    name: Déploiement Cloudflare Workers
    # Le déploiement ne part que depuis prod, et seulement si lint,
    # typecheck, tests et build sont verts.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Les déploiements ne se chevauchent pas.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Construit le Worker (next build + adaptation OpenNext).
      - name: Build Worker
        run: npm run cf:build

      # wrangler est déjà une devDependency : pas d'action tierce à maintenir.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
