version: 2
updates:
  # Dépendances npm : regroupées pour limiter le bruit de PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: preprod
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "three-mesh-bvh", "@types/three", "@react-three/*"]
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Actions GitHub utilisées par le CI.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: preprod
    commit-message:
      prefix: "chore(ci)"
